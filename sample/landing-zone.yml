name: Landing Zone
run-name: Deploying ${{ github.event.inputs.parameter_file_name }} to Subscription ${{ github.event.inputs.subscription_id }} in ${{ github.event.inputs.location }}

on:
  workflow_dispatch:
    inputs:
      subscription_id:
        description: "Azure subscription ID or name to be used for landing zone deployment"
        type: choice
        options:
          - "[SUBSCRIPTION NAME #1]"
          - "[SUBSCRIPTION NAME #2]"
          - "[SUBSCRIPTION NAME #3]"
          - "[SUBSCRIPTION NAME #4]"
      parameter_file_name:
        description: "Name of the parameter file to use for landing zone deployment"
        type: choice
        options:
          - landing-zone.workload1.bicepparam
          - landing-zone.workload2.bicepparam
          - landing-zone.workload3.bicepparam
          - landing-zone.workload4.bicepparam
      location:
        description: "Azure resources deployment location"
        type: choice
        options:
          - australiaeast
          - australiasoutheast
          - southeastasia
          - eastus
          - westus2

env:
  template_folder_path: bicep/patterns/landing-zone
  template_file_name: landing-zone.bicep
  parameter_file_path: bicep/patterns/landing-zone/${{ inputs.parameter_file_name }}
  location: ${{ inputs.location }}
  subscription_id: ${{ inputs.subscription_id }}
  oidc_app_reg_client_id: "[APP REG CLIENT ID]"
  azure_tenant_id: "[AZURE AD TENANT ID]"
  environment: "landing-zone"
  deployment_name: "deploy_landing_zone"

jobs:
  initialise_vars:
    runs-on: ubuntu-latest
    outputs:
      template_folder_path: ${{ env.template_folder_path }}
      template_file_name: ${{ env.template_file_name }}
      parameter_file_path: ${{ env.parameter_file_path }}
      location: ${{ env.location }}
      subscription_id: ${{ env.subscription_id }}
      oidc_app_reg_client_id: ${{ env.oidc_app_reg_client_id }}
      azure_tenant_id: ${{ env.azure_tenant_id }}
      environment: ${{ env.environment }}
      deployment_name: ${{ env.deployment_name }}
    steps:
      - name: Initialise Variables
        run: echo "Initialising environment variables"

  build_and_validate:
    needs: initialise_vars
    permissions:
      id-token: write
      contents: read
    environment:
      name: ${{ needs.initialise_vars.outputs.environment }}
    runs-on: ubuntu-latest
    steps:
      - name: Build Bicep Template
        uses: ./build-action.yml
        with:
          test_trigger: ${{ github.event_name }}
          template_file_path: ${{ needs.initialise_vars.outputs.template_folder_path }}/${{ needs.initialise_vars.outputs.template_file_name }}
          parameter_file_path: ${{ needs.initialise_vars.outputs.parameter_file_path }}
          oidc_app_reg_client_id: ${{ needs.initialise_vars.outputs.oidc_app_reg_client_id }}
          azure_tenant_id: ${{ needs.initialise_vars.outputs.azure_tenant_id }}
          location: ${{ needs.initialise_vars.outputs.location }}
          subscription_id: ${{ needs.initialise_vars.outputs.subscription_id }}
          deployment_name: ${{ needs.initialise_vars.outputs.deployment_name }}

  deploy:
    needs: [initialise_vars, build_and_validate]
    if: ${{ github.ref == 'refs/heads/main' }}
    permissions:
      id-token: write
      contents: read
    environment:
      name: ${{ needs.initialise_vars.outputs.environment }}
    runs-on: ubuntu-latest
    steps:
      - name: Deploy Bicep Template
        uses: ./deploy-action.yml
        with:
          location: ${{ needs.initialise_vars.outputs.location }}
          subscription_id: ${{ needs.initialise_vars.outputs.subscription_id }}
          template_file_name: ${{ needs.initialise_vars.outputs.template_file_name }}
          deployment_name: ${{ needs.initialise_vars.outputs.deployment_name }}
          oidc_app_reg_client_id: ${{ needs.initialise_vars.outputs.oidc_app_reg_client_id }}
          azure_tenant_id: ${{ needs.initialise_vars.outputs.azure_tenant_id }}
