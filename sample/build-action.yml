name: Build Template
description: "Template for building and linting Bicep files."

inputs:
  parameter_folder_path:
    description: "path to parameter folder"
    type: string
    required: false
  template_file_path:
    description: "Path to template file"
    type: string
    required: true
  parameter_file_path:
    description: "Path to the parameter file"
    type: string
    required: false
    default: ""
  parameter_file_name:
    description: "name of the parameter file"
    type: string
    required: false
    default: ""
  test_trigger:
    description: "GitHub event that will trigger tests to run, e.g., pull request"
    type: string
    required: true
  mode:
    description: "The contextual mode of the build, e.g., part of initial build or ongoing operations"
    type: string
    required: false
    default: build
  oidc_app_reg_client_id:
    description: "Client ID of Azure application registration used to authenticate using OIDC"
    type: string
    required: true
  azure_tenant_id:
    description: "Azure AD tenant/directory ID"
    type: string
    required: true
  environment:
    description: "GitHub environment for build jobs"
    type: string
    required: false
    default: build
  location:
    description: "Location for resource deployment"
    type: string
    required: false
  az_deployment_type:
    description: "Type of Azure deployment"
    type: string
    required: false
    default: subscription
  skip_whatif:
    description: "flag to skip what-if checks"
    type: string
    required: false
    default: "false"
  subscription_id:
    description: "Azure subscription ID used for deployments"
    type: string
    required: false
  management_group_id:
    description: "Management group ID for Azure deployment"
    type: string
    required: false
  resource_group_name:
    description: "Resource group name for Azure deployment"
    type: string
    required: false
  deployment_name:
    description: "Name of the ARM deployment"
    type: string
    required: true
  debug:
    description: "Enable debug mode (true/false)"
    type: boolean
    default: false
  palLink:
    description: "Enable PAL Link"
    type: boolean
    required: false
    default: false

runs:
  using: "composite"
  steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Login to Azure
      uses: azure/login@v2
      with:
        client-id: ${{ inputs.oidc_app_reg_client_id }}
        tenant-id: ${{ inputs.azure_tenant_id }}
        allow-no-subscriptions: true

    - name: Set PAL
      if: ${{ inputs.palLink == 'true' }}
      shell: pwsh
      run: |
        az extension add --name managementpartner
        az managementpartner create --partner-id 5353507 || true
        az managementpartner show
    
    - name: Get all changed param files
      if: ${{ inputs.mode == 'operations' }}
      id: changed-parameter-files
      shell: pwsh
      run: |
        $changedFiles = @()
        Write-Host "Initializing the changed files array." -ForegroundColor Green
        $branch = '${{ github.ref }}'
        $deploymentEvent = '${{ github.event_name }}'
        $mainBranch = if ('${{ github.event.repository.default_branch }}') { '${{ github.event.repository.default_branch }}' } else { 'main' }

        if($branch -ne "refs/heads/$mainBranch" -or $deploymentEvent -eq 'pull_request'){
          # Only get changed files
          # Get the list of changed files with rename detection
          Write-Host "Getting git diff..." -ForegroundColor Cyan
          try {
              if ($deploymentEvent -eq 'pull_request') {
                $baseRef = "${{ github.base_ref }}"
                Write-Host "PR detected. Using base ref: origin/$baseRef"
                git fetch origin $baseRef
                $diff = git diff --name-status --find-renames origin/$baseRef...HEAD
              } else {
                $diff = git diff --name-status --find-renames HEAD^ .
              }

              if (${{ inputs.debug }}) {
                  Write-Host "Debug Mode: Raw git diff output:"
                  Write-Host $diff
              }

              if ($null -eq $diff -or $diff -eq "") {
                  Write-Host "No git differences detected." -ForegroundColor Yellow
                  echo "all_changed_files=[]" >> "$env:GITHUB_OUTPUT"
                  echo "any_changed=false" >> "$env:GITHUB_OUTPUT"
                  exit 0
              }
          } catch {
              Write-Host "Error executing git diff: $_" -ForegroundColor Red
              exit 1
          }

          Write-Host "Git Diff output detected." -ForegroundColor Yellow
          $gitChanges = $diff.Split([Environment]::NewLine, [StringSplitOptions]::RemoveEmptyEntries)

          if (${{ inputs.debug }}) {
              Write-Host "Debug Mode: Parsed individual lines from git diff:"
              $gitChanges | ForEach-Object { Write-Host $_ }
          }

          Write-Host "Parsing individual changes..." -ForegroundColor Cyan
          $paramFolder = "${{ inputs.parameter_folder_path }}"

          foreach ($line in $gitChanges) {
            $parts = $line -split '\t+'

            if ($parts.Count -lt 2) {
                Write-Host "Unexpected format: $line" -ForegroundColor Red
                continue
            }

            $status = $parts[0]
            $path = $parts[1]

            if ($path -notlike "*$paramFolder*") {
                if (${{ inputs.debug }}) {
                    Write-Host "Debug Mode: Skipped file outside param folder: $path"
                }
                continue
            }

            if ($status.StartsWith('R') -and $parts.Count -ge 3) {
                $newPath = $parts[2]
                $changedFiles += $newPath
                Write-Host "Renamed from: [$path] to: [$newPath]" -ForegroundColor Magenta
            }
            elseif ($status.StartsWith('D')) {
                Write-Host "Skipping deleted file: [$path]" -ForegroundColor Green
            }
            else {
                $changedFiles += $path
                Write-Host "Modified: [$path]" -ForegroundColor Green
            }
          }
        } else{
          # Run all files in the target operations directory
          Write-Host "Targeting all .bicepparam files in ${{ inputs.parameter_folder_path }}" -ForegroundColor Green
          $folder = Split-Path -Path "${{ inputs.template_file_path }}" -Parent
          $files = Get-ChildItem -Path $folder -Recurse | Where-Object { $_.Name -like "*.bicepparam" }
          foreach ($file in $files){
            Write-Host "Processing file: $file"
            $relativePath = $file.FullName.Replace("${{ github.workspace }}\", "").Replace("\", "/")
            $changedFiles += $relativePath
          }
        }

        if ($changedFiles.Count -eq 0) {
            $jsonChanged = "[]"
            Write-Host "No parameter files changed." -ForegroundColor Yellow
            echo "all_changed_files=$jsonChanged" >> "$env:GITHUB_OUTPUT"
            echo "any_changed=false" >> "$env:GITHUB_OUTPUT"
        } else {
            $jsonChanged = $changedFiles | ConvertTo-Json -Compress

            if (${{ inputs.debug }}) {
                Write-Host "Debug Mode: Final changed files JSON: $jsonChanged"
            }

            Write-Host "Changed files JSON: $jsonChanged" -ForegroundColor Yellow
            echo "all_changed_files=$jsonChanged" >> "$env:GITHUB_OUTPUT"
            echo "any_changed=true" >> "$env:GITHUB_OUTPUT"
        }

    - name: List all changed parameter files
      if: ${{ inputs.mode == 'operations' && steps.changed-parameter-files.outputs.any_changed == 'true' }}
      shell: pwsh
      env:
        ALL_CHANGED_FILES: ${{ steps.changed-parameter-files.outputs.all_changed_files }}
      run: |
        Write-Host "Listing all changed parameter files..."
        $changedFiles = '${{ env.ALL_CHANGED_FILES }}'

        if (-not $changedFiles -or $changedFiles -eq '[]') {
            Write-Host "No changed parameter files to display."
            exit 0
        }

        try {
            $fileList = $changedFiles | ConvertFrom-Json
            foreach ($file in $fileList) {
                Write-Host "$file was changed"
            }
        } catch {
            Write-Host "Failed to parse ALL_CHANGED_FILES as JSON: $_"
            exit 1
        }

    - name: Lint & Bicep Build
      shell: pwsh
      env:
        BUILDFOLDERPATH: ${{ runner.temp }}/build
        TESTFOLDERPATH: ${{ runner.temp }}/tests
        ALL_CHANGED_FILES: ${{ steps.changed-parameter-files.outputs.all_changed_files }}
        ANY_CHANGED_FILES: ${{ steps.changed-parameter-files.outputs.any_changed }}
      run: |
        New-Item -ItemType Directory -Force -Path "${{ env.BUILDFOLDERPATH }}"       | Out-Null
        New-Item -ItemType Directory -Force -Path "${{ env.BUILDFOLDERPATH }}/param" | Out-Null
        New-Item -ItemType Directory -Force -Path "${{ env.TESTFOLDERPATH }}"        | Out-Null

        if (${{ inputs.debug }}) {
          Write-Host "Debug Mode: Created build and test folders at ${{ env.BUILDFOLDERPATH }} and ${{ env.TESTFOLDERPATH }}."
        }

        $all_changed_files='${{ env.ALL_CHANGED_FILES }}'.replace(']','').replace('[','').replace('"','')

        # Lint the Bicep file and output the results to a file
        $sarifPath = Join-Path "${{ env.TESTFOLDERPATH }}" "bicep.sarif"

        # Redirect ALL streams (stdout+stderr) so the file is created even on warnings/errors
        bicep lint ${{ inputs.template_file_path }} --diagnostics-format sarif *> $sarifPath

        # If for any reason the SARIF file doesn't exist, create a minimal empty SARIF so later steps don't fail
        if (!(Test-Path $sarifPath)) {
          $emptySarif = @{
            version = "2.1.0"
            runs = @(@{
              tool = @{ driver = @{ name = "bicep" } }
              results = @()
            })
          } | ConvertTo-Json -Depth 5
          Set-Content -Path $sarifPath -Value $emptySarif
        }

        if (${{ inputs.debug }}) {
          Write-Host "Debug Mode: Linting completed for ${{ inputs.template_file_path }}. Output saved to ${{ env.TESTFOLDERPATH }}/bicep.sarif."
        }

        # Parse SARIF
        try {
            $testResults = Get-Content ${{ env.TESTFOLDERPATH }}/bicep.sarif | ConvertFrom-Json
            Write-Host "SARIF JSON content successfully converted."
            if (${{ inputs.debug }}) {
              Write-Host "Debug Mode: SARIF JSON content:"
              $testResults | ConvertTo-Json
            }
        } catch {
            Write-Host "Failed to convert SARIF file to JSON. Exiting."
            exit 1
        }

        # Fail on lint errors
        $hasErrors = $false
        foreach ($run in $testResults.runs) {
            foreach ($result in $run.results) {
                if ($result.level -eq 'error') { $hasErrors = $true; break }
            }
        }
        if ($hasErrors) {
            Write-Host "Linting Test Failed! Errors found in the SARIF report."
            if (${{ inputs.debug }}) { cat ${{ env.TESTFOLDERPATH }}/bicep.sarif }
            exit 1
        } else {
            Write-Host "Linting Test Passed! No errors found."
        }

        # Build the template
        az bicep build --file "${{ inputs.template_file_path }}" --outdir '${{ env.BUILDFOLDERPATH }}'
        if (${{ inputs.debug }}) {
          Write-Host "Debug Mode: Bicep template built and copied to ${{ env.BUILDFOLDERPATH }}."
        }

        # Build/copy parameter file (non-operations mode)
        if ([string]::Compare("${{ inputs.mode }}", "operations", $true) -ne 0) {
          Write-Output "Mode is NOT 'operations'. Proceeding with parameter file processing."
          if ("${{ inputs.parameter_file_path }}" -like "*.bicepparam") {
              bicep build-params "${{ inputs.parameter_file_path }}" --outfile "${{ env.BUILDFOLDERPATH }}/azuredeploy.parameters.json"
              if (${{ inputs.debug }}) {
                Write-Host "Debug Mode: Parameters file built to ${{ env.BUILDFOLDERPATH }}/azuredeploy.parameters.json."
              }
          } elseif ("${{ inputs.parameter_file_path }}" -like "*.json") {
              Copy-Item -Path "${{ inputs.parameter_file_path }}" -Destination '${{ env.BUILDFOLDERPATH }}'
          }
        } else {
          Write-Output "Mode is 'operations'. Skipping non-operations parameter file processing."
        }

        # Process changed params (operations mode)
        if ([string]::Compare("${{ inputs.mode }}", "operations", $true) -eq 0 -and "${{ env.ANY_CHANGED_FILES }}" -eq "true") {
            $files = $all_changed_files -split ","
            Write-Output "Processing changed parameter files: $files"
            foreach ($file in $files) {
                if ($file -like "*.bicepparam") {
                    $outputFile = $file -replace "\.bicepparam$", ".parameters.json"
                    Write-Output "Building parameter file: $file -> $outputFile"
                    bicep build-params $file --outfile $outputFile
                    Copy-Item -Path $outputFile -Destination '${{ env.BUILDFOLDERPATH }}/param'
                }
            }
        } else {
            Write-Output "No parameter file changes detected. Skipping parameter processing."
        }

        # Handle explicitly specified parameter file (operations mode)
        if ([string]::Compare("${{ inputs.mode }}", "operations", $true) -eq 0 -and "${{ inputs.parameter_file_name }}" -ne "") {
            $paramFilePath = "${{ inputs.parameter_file_path }}/${{ inputs.parameter_file_name }}"
            if ($paramFilePath -like "*.bicepparam") {
                $outputFile = $paramFilePath -replace "\.bicepparam$", ".parameters.json"
                Write-Output "Building specified parameter file: $paramFilePath -> $outputFile"
                bicep build-params $paramFilePath --outfile $outputFile
                Copy-Item -Path $outputFile -Destination '${{ env.BUILDFOLDERPATH }}/param'
            } elseif ($paramFilePath -like "*.json") {
                Write-Output "Copying specified parameter file: $paramFilePath"
                Copy-Item -Path $paramFilePath -Destination '${{ env.BUILDFOLDERPATH }}/param'
            }
        }

        # Reset any stray native exit codes
        $global:LASTEXITCODE = 0

    - name: What-If Deploy to Azure (Operations)
      shell: pwsh
      if: ${{ success() && inputs.mode == 'operations' && (steps.changed-parameter-files.outputs.any_changed == 'true' || inputs.parameter_file_name != '') }}
      env:
        BUILDFOLDERPATH: ${{ runner.temp }}/build
      run: |
        $ErrorActionPreference = 'stop'

        if (${{ inputs.debug }}) {
          Write-Host "Debug Mode: Preparing for What-If deployment (Operations) with template path: ${{ inputs.template_file_path }}."
        }

        # Get all processed parameter files from param directory
        $files = Get-ChildItem -Path "${{ env.BUILDFOLDERPATH }}/param" -Filter "*.json" | Select-Object -ExpandProperty Name
        Write-Output "Processing parameter files from param folder: $files"

        # Extract the template file name
        $template = "${{ inputs.template_file_path }}".Substring("${{ inputs.template_file_path }}".LastIndexOf("/")+1).Replace(".bicep",".json")

        foreach ($file in $files) {
          $paramFilePath = "${{ env.BUILDFOLDERPATH }}/param/$file"

          if (!(Test-Path $paramFilePath)) {
            Write-Host "Error: Parameter file does not exist - $paramFilePath"
            exit 1
          }

          # Read and parse the JSON parameter file
          $paramFile = Get-Content $paramFilePath | ConvertFrom-Json

          # Extract Subscription ID and Location if available
          $subId = if ($paramFile.parameters.PSObject.Properties.Name -contains 'subscriptionId') {
              $paramFile.parameters.subscriptionId.value
          } else {
              "${{ inputs.subscription_id }}"
          }

          $location = if ($paramFile.parameters.PSObject.Properties.Name -contains 'location') {
              $paramFile.parameters.location.value
          } else {
              "${{ inputs.location }}"
          }

          Write-Output "Extracted Subscription ID: $subId"
          Write-Output "Extracted Location: $location"

          # Run appropriate deployment command
          if ('${{ inputs.az_deployment_type }}' -eq "subscription" ){
            az account set --subscription $subId
            az deployment sub what-if `
              --name '${{ inputs.deployment_name }}' `
              --location $location `
              --subscription $subId `
              --template-file "${{ env.BUILDFOLDERPATH }}/$template" --parameters "@$paramFilePath"
          }
          elseif ('${{ inputs.az_deployment_type }}' -eq "tenant" ){
            az deployment tenant what-if `
              --name '${{ inputs.deployment_name }}' `
              --location '${{ inputs.location }}' `
              --template-file "${{ env.BUILDFOLDERPATH }}/$template" --parameters "@$paramFilePath"
          }
          elseif ('${{ inputs.az_deployment_type }}' -eq "managementgroup" ){
            az deployment mg what-if `
              --name '${{ inputs.deployment_name }}' `
              --location '${{ inputs.location }}' `
              --management-group-id '${{ inputs.management_group_id }}' `
              --template-file "${{ env.BUILDFOLDERPATH }}/$template" --parameters "@$paramFilePath"
          }
          elseif ('${{ inputs.az_deployment_type }}' -eq "resourcegroup" ){
            az account set --subscription $subId
            az deployment group what-if `
              --name '${{ inputs.deployment_name }}' `
              --resource-group '${{ inputs.resource_group_name }}' `
              --template-file "${{ env.BUILDFOLDERPATH }}/$template" --parameters "@$paramFilePath"
          }
          else {
            Write-Host "Error: Unsupported deployment type - ${{ inputs.az_deployment_type }}"
            exit 1
          }

          if ($? -eq $false) {
            Write-Host "Error: az deployment command failed for $paramFilePath"
            exit 1
          }
        }

    - name: What-If Deploy to Azure
      shell: pwsh
      if: ${{ success() && inputs.mode == 'build' && inputs.skip_whatif != 'true' }}
      env:
        BUILDFOLDERPATH: ${{ runner.temp }}/build
      run: |
        $ErrorActionPreference = 'stop'
        if (${{ inputs.debug }}) {
          Write-Host "Debug Mode: Preparing for What-If deployment (Build) with template path: ${{ inputs.template_file_path }}."
        }

        $paramPath = (Get-ChildItem -Path "${{ env.BUILDFOLDERPATH }}" -Filter *.parameters.json | Select-Object -First 1 -ExpandProperty FullName)
        $template  = "${{ inputs.template_file_path }}".Substring("${{ inputs.template_file_path }}".LastIndexOf("/")+1).Replace(".bicep",".json")

        if (-not $paramPath) {
          Write-Host "No *.parameters.json file found in ${{ env.BUILDFOLDERPATH }}. Skipping What-If."
          exit 0
        }

        if ('${{ inputs.az_deployment_type }}' -eq "subscription" ){
          az account set --subscription '${{ inputs.subscription_id}}'
          az deployment sub what-if `
            --name '${{ inputs.deployment_name }}' `
            --location '${{ inputs.location }}' `
            --subscription '${{ inputs.subscription_id }}' `
            --template-file "${{ env.BUILDFOLDERPATH }}/$template" --parameters "@$paramPath"
        }
        if ('${{ inputs.az_deployment_type }}' -eq "tenant" ){
          az deployment tenant what-if `
            --name '${{ inputs.deployment_name }}' `
            --location '${{ inputs.location }}' `
            --template-file "${{ env.BUILDFOLDERPATH }}/$template" --parameters "@$paramPath"
        }
        if ('${{ inputs.az_deployment_type }}' -eq "managementgroup" ){
          az deployment mg what-if `
            --name '${{ inputs.deployment_name }}' `
            --location '${{ inputs.location }}' `
            --management-group-id '${{ inputs.management_group_id }}' `
            --template-file "${{ env.BUILDFOLDERPATH }}/$template" --parameters "@$paramPath"
        }
        if ('${{ inputs.az_deployment_type }}' -eq "resourcegroup" ){
          az account set --subscription '${{ inputs.subscription_id }}'
          az deployment group what-if `
            --name '${{ inputs.deployment_name }}' `
            --resource-group '${{ inputs.resource_group_name }}' `
            --template-file "${{ env.BUILDFOLDERPATH }}/$template" --parameters "@$paramPath"
        }

    - name: Generate Test results
      shell: pwsh
      if: always()
      env:
        TESTFOLDERPATH: ${{ runner.temp }}/tests
      run: |
        $sarifPath = Join-Path "${{ env.TESTFOLDERPATH }}" "bicep.sarif"

        if (!(Test-Path $sarifPath)) {
          Write-Host "No SARIF found at $sarifPath. Creating a default empty report."
          $emptySarif = @{
            version = "2.1.0"
            runs = @(@{
              tool = @{ driver = @{ name = "bicep" } }
              results = @()
            })
          } | ConvertTo-Json -Depth 5
          Set-Content -Path $sarifPath -Value $emptySarif
        }

        $results = Get-Content $sarifPath | ConvertFrom-Json

        # Option A: just use the first run
        $runResults = @()
        if ($results.runs -and $results.runs.Count -ge 1 -and $results.runs[0].results) {
          $runResults = $results.runs[0].results
        }

        if ($runResults.Count -ge 1) {
          $markdown = ''
          $markdown += "| Test | ID | Description | Result |"
          $markdown += "`n |:-------- | :-------- | :-------- | :----- |"
          $testCount = 0
          foreach ($failure in $runResults) {
            $testNumber = $testCount += 1
            $testId = $failure.ruleId
            $testDesc = $failure.message.text
            $testResult = ':x:'
            $markdown += "`n | $testNumber | $testId | $testDesc | $testResult |"
          }
        }
        else {
          $testResult = 'All Lint Tests Passed :white_check_mark:'
          $markdown = ''
          $markdown += "| Test Results |"
          $markdown += "`n |:-------- |"
          $markdown += "`n | $testResult |"
        }

        Set-Content -Path ${{ env.TESTFOLDERPATH }}/test-results.md -Value $markdown
        Get-Content ${{ env.TESTFOLDERPATH }}/test-results.md > $GITHUB_STEP_SUMMARY

    - name: Publish Test Results
      shell: bash
      if: always()
      env:
        TESTFOLDERPATH: ${{ runner.temp }}/tests
      run: |
        echo "### Test Results :robot:" > $GITHUB_STEP_SUMMARY
        cat ${{ env.TESTFOLDERPATH }}/test-results.md >> $GITHUB_STEP_SUMMARY

    - name: Publish Pipeline Artifact
      if: ${{ inputs.test_trigger != 'pull_request' }}
      env:
        BUILDFOLDERPATH: ${{ runner.temp }}/build
      uses: actions/upload-artifact@v4
      with:
        name: deploy
        path: "${{ env.BUILDFOLDERPATH }}"
