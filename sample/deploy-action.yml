name: Deploy Template
description: "Template for deploying Bicep files to Azure."

inputs:
  environment:
    description: "GitHub environment for deployment jobs"
    type: string
    required: true
  location:
    description: "Location for resource deployment"
    type: string
    required: true
  subscription_id:
    description: "Azure subscription ID used for deployments"
    type: string
    required: true
  template_file_name:
    description: "Name of the template file to be deployed (assume it's been built from Bicep into JSON)"
    type: string
    required: true
  deployment_name:
    description: "Name of the ARM deployment"
    type: string
    required: true
  az_deployment_type:
    description: "Type of Azure deployment"
    type: string
    required: false
    default: subscription
  mode:
    description: "The contextual mode of the deployment, either deploy or operations"
    type: string
    required: false
    default: deploy
  management_group_id:
    description: "Management group ID for Azure deployment"
    type: string
    required: false
    default: ""
  resource_group_name:
    description: "Resource group name for Azure deployment"
    type: string
    required: false
    default: ""
  oidc_app_reg_client_id:
    description: "Client ID of Azure application registration used to authenticate using OIDC"
    type: string
    required: true
  azure_tenant_id:
    description: "Azure AD tenant/directory ID"
    type: string
    required: true
  debug:
    description: "Enable debug mode (true/false)"
    type: boolean
    default: false

runs:
  using: "composite"
  steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Download Artifact
      uses: actions/download-artifact@v4
      with:
        name: deploy
        path: ${{ github.workspace }}/deploy

    - name: Login to Azure
      uses: azure/login@v2
      with:
        client-id: ${{ inputs.oidc_app_reg_client_id }}
        tenant-id: ${{ inputs.azure_tenant_id }}
        allow-no-subscriptions: true

    # ---- OPERATIONS MODE ----
    - name: Deploy to Azure (Operations)
      shell: pwsh
      if: inputs.mode == 'operations'
      run: |
        $ErrorActionPreference = 'stop'

        if (${{ inputs.debug }}) {
          Write-Host "Debug Mode: Starting deployment (Operations) with template file name: ${{ inputs.template_file_name }}."
        }

        $deployDir = "${{ github.workspace }}/deploy"
        if (!(Test-Path $deployDir)) {
            Write-Host "❌ Error: Deploy directory does not exist: $deployDir"
            exit 1
        }

        Write-Host "📂 Listing files in deploy directory:"
        Get-ChildItem -Path $deployDir -Recurse | ForEach-Object { Write-Host $_.FullName }

        # Collect parameter files as string paths (not FileInfo objects)
        $files = Get-ChildItem -Path $deployDir -Recurse -Filter "*.parameters*.json" | Select-Object -ExpandProperty FullName
        if (-not $files -or $files.Count -eq 0) {
            Write-Host "❌ Error: No .parameters*.json files found in deploy directory!"
            exit 1
        }

        $templateJson = "${{ inputs.template_file_name }}".Replace(".bicep",".json")
        $templatePath = Join-Path $deployDir $templateJson

        if (!(Test-Path $templatePath)) {
          Write-Host "❌ Error: Template JSON not found at: $templatePath"
          exit 1
        }

        foreach ($filePath in $files) {
          Write-Host "🚀 Processing deployment file: $filePath"

          if ('${{ inputs.az_deployment_type }}' -eq 'subscription' ){
            $paramFile = Get-Content $filePath | ConvertFrom-Json

            # Compose a safe deployment name (<=64 chars)
            $sanitizedFileName = (Split-Path -Path $filePath -LeafBase) -replace '[^a-zA-Z0-9]', ''
            $trimmedDeploymentName = ("${{ inputs.deployment_name }}-$sanitizedFileName")
            if ($trimmedDeploymentName.Length -gt 64) { $trimmedDeploymentName = $trimmedDeploymentName.Substring(0,64) }

            $subId   = $paramFile.parameters.subscriptionId.value
            if (-not $subId) { $subId = "${{ inputs.subscription_id }}" }

            $location = $paramFile.parameters.location.value
            if (-not $location) { $location = "${{ inputs.location }}" }

            Write-Host "📌 Using Subscription ID: $subId"
            Write-Host "📌 Using Location: $location"

            az account set --subscription $subId
            if ($LASTEXITCODE -ne 0) { throw "az account set failed (rc=$LASTEXITCODE)" }

            if (${{ inputs.debug }}) {
              Write-Host "Debug Mode: Deploying (Subscription level) with subscription: $subId, location: $location, and deployment name: $trimmedDeploymentName."
            }

            az deployment sub create `
              --name $trimmedDeploymentName `
              --location $location `
              --subscription $subId `
              --template-file "$templatePath" --parameters "@$filePath"
            if ($LASTEXITCODE -ne 0) { throw "az deployment sub create failed (rc=$LASTEXITCODE)" }
          }

          if ('${{ inputs.az_deployment_type }}' -eq 'tenant' ){
            Write-Host "📌 Deploying at tenant level..."
            az deployment tenant create `
              --name '${{ inputs.deployment_name }}' `
              --location '${{ inputs.location }}' `
              --template-file "$templatePath" --parameters "@$filePath"
            if ($LASTEXITCODE -ne 0) { throw "az deployment tenant create failed (rc=$LASTEXITCODE)" }
          }

          if ('${{ inputs.az_deployment_type }}' -eq 'managementgroup' ){
            Write-Host "📌 Deploying at management group level..."
            az deployment mg create `
              --name '${{ inputs.deployment_name }}' `
              --location '${{ inputs.location }}' `
              --management-group-id '${{ inputs.management_group_id }}' `
              --template-file "$templatePath" --parameters "@$filePath"
            if ($LASTEXITCODE -ne 0) { throw "az deployment mg create failed (rc=$LASTEXITCODE)" }
          }

          if ('${{ inputs.az_deployment_type }}' -eq 'resourcegroup' ){
            Write-Host "📌 Deploying at resource group level..."
            $paramFile = Get-Content $filePath | ConvertFrom-Json
            $subId = $paramFile.parameters.subscriptionId.value
            if (-not $subId) { $subId = "${{ inputs.subscription_id }}" }

            Write-Host "📌 Using Subscription ID: $subId"
            az account set --subscription $subId
            if ($LASTEXITCODE -ne 0) { throw "az account set failed (rc=$LASTEXITCODE)" }

            az deployment group create `
              --name '${{ inputs.deployment_name }}' `
              --resource-group '${{ inputs.resource_group_name }}' `
              --template-file "$templatePath" --parameters "@$filePath"
            if ($LASTEXITCODE -ne 0) { throw "az deployment group create failed (rc=$LASTEXITCODE)" }
          }
        }

        # Normalize any stray native exit codes before leaving the step
        $global:LASTEXITCODE = 0

    # ---- DEPLOY MODE ----
    - name: Deploy to Azure
      shell: pwsh
      if: inputs.mode == 'deploy'
      run: |
        $ErrorActionPreference = 'stop'

        if (${{ inputs.debug }}) {
          Write-Host "Debug Mode: Starting deployment (Deploy) with template file name: ${{ inputs.template_file_name }}."
        }

        $deployDir = "${{ github.workspace }}/deploy"
        if (!(Test-Path $deployDir)) {
          Write-Host "❌ Error: Deploy directory does not exist: $deployDir"
          exit 1
        }

        $paramPath = (Get-ChildItem -Path $deployDir -Filter *.parameters.json | Select-Object -First 1 -ExpandProperty FullName)
        if (-not $paramPath) {
          Write-Host "❌ Error: No *.parameters.json file found in $deployDir"
          exit 1
        }

        $templateJson = "${{ inputs.template_file_name }}".Replace(".bicep",".json")
        $templatePath = Join-Path $deployDir $templateJson

        if (!(Test-Path $templatePath)) {
          Write-Host "❌ Error: Template JSON not found at: $templatePath"
          exit 1
        }

        if ('${{ inputs.az_deployment_type }}' -eq 'subscription' ){
          az account set --subscription '${{ inputs.subscription_id}}'
          if ($LASTEXITCODE -ne 0) { throw "az account set failed (rc=$LASTEXITCODE)" }

          az deployment sub create `
            --name '${{ inputs.deployment_name }}' `
            --location '${{ inputs.location }}' `
            --subscription '${{ inputs.subscription_id }}' `
            --template-file "$templatePath" --parameters "@$paramPath"
          if ($LASTEXITCODE -ne 0) { throw "az deployment sub create failed (rc=$LASTEXITCODE)" }
        }
        if ('${{ inputs.az_deployment_type }}' -eq 'tenant' ){
          az deployment tenant create `
            --name '${{ inputs.deployment_name }}' `
            --location '${{ inputs.location }}' `
            --template-file "$templatePath" --parameters "@$paramPath"
          if ($LASTEXITCODE -ne 0) { throw "az deployment tenant create failed (rc=$LASTEXITCODE)" }
        }
        if ('${{ inputs.az_deployment_type }}' -eq 'managementgroup'){
          az deployment mg create `
            --name '${{ inputs.deployment_name }}' `
            --location '${{ inputs.location }}' `
            --management-group-id '${{ inputs.management_group_id }}' `
            --template-file "$templatePath" --parameters "@$paramPath"
          if ($LASTEXITCODE -ne 0) { throw "az deployment mg create failed (rc=$LASTEXITCODE)" }
        }
        if ('${{ inputs.az_deployment_type }}' -eq 'resourcegroup' ){
          az account set --subscription '${{ inputs.subscription_id }}'
          if ($LASTEXITCODE -ne 0) { throw "az account set failed (rc=$LASTEXITCODE)" }

          az deployment group create `
            --name '${{ inputs.deployment_name }}' `
            --resource-group '${{ inputs.resource_group_name }}' `
            --template-file "$templatePath" --parameters "@$paramPath"
          if ($LASTEXITCODE -ne 0) { throw "az deployment group create failed (rc=$LASTEXITCODE)" }
        }

        # Normalize any stray native exit codes before leaving the step
        $global:LASTEXITCODE = 0
