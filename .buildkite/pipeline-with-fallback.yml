agents:
  queue: "default"

env:
  # Uncomment to use environment variables as fallback when Buildkite Secrets are not configured:
  # AZURE_CLIENT_ID: "your-client-id"
  # AZURE_CLIENT_SECRET: "your-client-secret"
  # AZURE_TENANT_ID: "your-tenant-id"

steps:
  - label: ":azure: Install Azure CLI & Login"
    key: "azure-setup"
    command:
      - "bash .buildkite/scripts/install-az.sh"
      - "bash .buildkite/scripts/az-login-with-fallback.sh"
    retry:
      automatic:
        - exit_status: "*"
          limit: 2
    timeout_in_minutes: 10

  - wait

  - label: ":white_check_mark: Verify Azure Access"
    key: "verify-access"
    command:
      - "bash .buildkite/scripts/install-az.sh"
      - "bash .buildkite/scripts/az-login-with-fallback.sh"
      - "bash .buildkite/scripts/verify-access.sh"
    soft_fail: true
    timeout_in_minutes: 5
