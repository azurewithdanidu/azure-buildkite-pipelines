agents:
  queue: "default"

# OIDC variant of pipeline-bicep-landing-zone.yml.
#
# Authenticates to Azure using Workload Identity Federation — no client secret
# is stored in Buildkite. See OIDC-README.md for setup instructions.
env:
  # Azure identifiers (not secrets)
  ARM_CLIENT_ID:       "REPLACE-WITH-APP-REGISTRATION-CLIENT-ID"
  ARM_TENANT_ID:       "REPLACE-WITH-ENTRA-TENANT-ID"
  ARM_SUBSCRIPTION_ID: "REPLACE-WITH-SUBSCRIPTION-ID"

  # Optional: override the OIDC trust scope. Default is pipeline_id.
  # BUILDKITE_OIDC_SUBJECT_CLAIM: "cluster_id"

  # Bicep deployment configuration
  BICEP_TEMPLATE_FILE_PATH: "bicep/main.bicep"
  BICEP_DEPLOYMENT_NAME: "deploy_bicep"
  AZURE_DEPLOYMENT_TYPE: "subscription"

steps:
  # -----------------------------------------------------------------------
  # Step 1: User selects deployment parameters.
  # -----------------------------------------------------------------------
  - block: ":gear: Configure Deployment"
    prompt: "Select the deployment parameters for the landing zone"
    fields:
      - select: "Parameter File"
        key: "parameter_file_path"
        required: true
        options:
          - label: "Workload 1"
            value: "bicep/main.bicepparam"

      - select: "Target Subscription"
        key: "subscription_id"
        required: true
        options:
          - label: "sample-subscription-1"
            value: ""

      - select: "Location"
        key: "location"
        required: true
        default: "australiaeast"
        options:
          - label: "Australia East"
            value: "australiaeast"

  # -----------------------------------------------------------------------
  # Step 2: Lint & Build
  # -----------------------------------------------------------------------
  - label: ":bicep: Lint & Build"
    key: "build"
    command:
      - "bash .buildkite/scripts/install-az.sh"
      - "bash .buildkite/scripts/az-login-oidc.sh"
      - "bash .buildkite/scripts/bicep-install.sh"
      - "bash .buildkite/scripts/bicep-build.sh"
    artifact_paths:
      - "deploy/**"
    timeout_in_minutes: 15

  - wait

  # -----------------------------------------------------------------------
  # Step 3: What-If — preview changes without applying them.
  # -----------------------------------------------------------------------
  - label: ":mag: What-If Deploy"
    key: "whatif"
    command:
      - "bash .buildkite/scripts/install-az.sh"
      - "bash .buildkite/scripts/az-login-oidc.sh"
      - "bash .buildkite/scripts/bicep-install.sh"
      - "buildkite-agent artifact download 'deploy/**' ."
      - "bash .buildkite/scripts/bicep-whatif.sh"
    timeout_in_minutes: 15

  - wait

  # -----------------------------------------------------------------------
  # Step 4: Manual approval (main branch only).
  # -----------------------------------------------------------------------
  - block: ":rocket: Approve Deployment to Azure"
    prompt: "Review the What-If output above. Approve to deploy to Azure."
    if: build.branch == "main"

  # -----------------------------------------------------------------------
  # Step 5: Deploy (main branch only).
  # -----------------------------------------------------------------------
  - label: ":azure: Deploy to Azure"
    key: "deploy"
    command:
      - "bash .buildkite/scripts/install-az.sh"
      - "bash .buildkite/scripts/az-login-oidc.sh"
      - "bash .buildkite/scripts/bicep-install.sh"
      - "buildkite-agent artifact download 'deploy/**' ."
      - "bash .buildkite/scripts/bicep-deploy.sh"
    if: build.branch == "main"
    timeout_in_minutes: 30
    concurrency: 1
    concurrency_group: "bicep-landing-zone-deploy"
