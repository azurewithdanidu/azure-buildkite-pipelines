steps:
  - label: ":azure: Install Azure CLI and Login (Linux)"
    command: |
      #!/bin/bash
      set -euo pipefail
      
      # Install Azure CLI on Debian/Ubuntu
      echo "Installing Azure CLI on Linux..."
      
      # Update package index
      sudo apt-get update
      
      # Install prerequisites
      sudo apt-get install -y ca-certificates curl apt-transport-https lsb-release gnupg
      
      # Download and install the Microsoft signing key
      sudo mkdir -p /etc/apt/keyrings
      curl -sLS https://packages.microsoft.com/keys/microsoft.asc |
        gpg --dearmor |
        sudo tee /etc/apt/keyrings/microsoft.gpg > /dev/null
      sudo chmod go+r /etc/apt/keyrings/microsoft.gpg
      
      # Add the Azure CLI software repository
      AZ_DIST=$(lsb_release -cs)
      echo "deb [arch=amd64 signed-by=/etc/apt/keyrings/microsoft.gpg] https://packages.microsoft.com/repos/azure-cli/ $AZ_DIST main" |
        sudo tee /etc/apt/sources.list.d/azure-cli.list
      
      # Update repository information and install
      sudo apt-get update
      sudo apt-get install -y azure-cli
      
      # Verify installation
      az version
      
      # Login with service principal if credentials are available
      if [ -n "${AZURE_CLIENT_ID:-}" ] && [ -n "${AZURE_CLIENT_SECRET:-}" ] && [ -n "${AZURE_TENANT_ID:-}" ]; then
        echo "Logging in with service principal..."
        az login --service-principal \
          --username "$AZURE_CLIENT_ID" \
          --password "$AZURE_CLIENT_SECRET" \
          --tenant "$AZURE_TENANT_ID"
        
        # Verify login
        az account show
      else
        echo "Azure credentials not found."
        echo "Set AZURE_CLIENT_ID, AZURE_CLIENT_SECRET, and AZURE_TENANT_ID environment variables."
      fi
    agents:
      queue: "default"
      os: "linux"
    env:
      # Configure these in Buildkite Pipeline Settings → Environment Variables
      # AZURE_CLIENT_ID: "your-client-id"
      # AZURE_CLIENT_SECRET: "your-client-secret"
      # AZURE_TENANT_ID: "your-tenant-id"
