steps:
  - group: ":azure: Azure Setup"
    key: "azure-setup"
    steps:
      - label: ":azure: Install and Login"
        key: "azure-login"
        command: |
          #!/bin/bash
          set -euo pipefail
          
          echo "--- :azure: Installing Azure CLI"
          curl -sL https://aka.ms/InstallAzureCLIDeb | sudo bash
          
          echo "--- :azure: Verifying Installation"
          az version
          
          echo "--- :key: Logging in to Azure"
          az login --service-principal \
            --username "$AZURE_CLIENT_ID" \
            --password "$AZURE_CLIENT_SECRET" \
            --tenant "$AZURE_TENANT_ID"
          
          echo "--- :white_check_mark: Login Successful"
          az account show
        agents:
          queue: "default"

  - wait

  - group: ":test_tube: Build & Test"
    key: "build-test"
    depends_on: "azure-setup"
    steps:
      - label: ":nodejs: Build Application"
        key: "build"
        command: |
          echo "--- :npm: Installing dependencies"
          npm ci
          
          echo "--- :hammer: Building application"
          npm run build
          
          echo "--- :package: Creating deployment package"
          cd dist && zip -r ../app.zip . && cd ..
        artifact_paths:
          - "app.zip"
        agents:
          queue: "default"

      - label: ":test_tube: Run Tests"
        key: "test"
        command: |
          echo "--- :test_tube: Running tests"
          npm test
        agents:
          queue: "default"

  - wait

  - block: ":rocket: Deploy to Azure?"
    prompt: "Ready to deploy to Azure App Service?"
    fields:
      - select: "Environment"
        key: "environment"
        options:
          - label: "Development"
            value: "dev"
          - label: "Staging"
            value: "staging"
          - label: "Production"
            value: "prod"
        default: "dev"

  - label: ":rocket: Deploy to Azure App Service"
    key: "deploy"
    depends_on:
      - "build"
      - "test"
      - "azure-login"
    command: |
      #!/bin/bash
      set -euo pipefail
      
      # Get the selected environment
      ENV=$(buildkite-agent meta-data get "environment")
      
      echo "--- :azure: Setting Azure subscription"
      az account set --subscription "$AZURE_SUBSCRIPTION_ID"
      
      echo "--- :package: Downloading build artifact"
      buildkite-agent artifact download "app.zip" .
      
      echo "--- :rocket: Deploying to App Service ($ENV)"
      az webapp deployment source config-zip \
        --resource-group "myapp-${ENV}-rg" \
        --name "myapp-${ENV}" \
        --src ./app.zip
      
      echo "--- :white_check_mark: Deployment complete"
      az webapp show \
        --resource-group "myapp-${ENV}-rg" \
        --name "myapp-${ENV}" \
        --query "defaultHostName" \
        --output tsv | \
        xargs -I {} echo "App URL: https://{}"
      
      # Create deployment annotation
      buildkite-agent annotate --style success --context deploy \
        "Deployed to Azure App Service: https://myapp-${ENV}.azurewebsites.net"
    agents:
      queue: "default"
    concurrency: 1
    concurrency_group: "deploy-${BUILDKITE_BRANCH}"

  - wait

  - label: ":chart_with_upwards_trend: Health Check"
    command: |
      #!/bin/bash
      set -euo pipefail
      
      ENV=$(buildkite-agent meta-data get "environment")
      APP_URL="https://myapp-${ENV}.azurewebsites.net/health"
      
      echo "--- :stethoscope: Checking application health"
      echo "URL: $APP_URL"
      
      for i in {1..10}; do
        if curl -f -s "$APP_URL" > /dev/null; then
          echo "✅ Health check passed!"
          buildkite-agent annotate --style success --context health \
            "Health check passed for $APP_URL"
          exit 0
        fi
        echo "Attempt $i failed, retrying in 10 seconds..."
        sleep 10
      done
      
      echo "❌ Health check failed after 10 attempts"
      buildkite-agent annotate --style error --context health \
        "Health check failed for $APP_URL"
      exit 1
    agents:
      queue: "default"
    soft_fail: true

notify:
  - email: "devops@example.com"
    if: build.state == "failed"
  
  - email: "team@example.com"
    if: build.state == "passed" && build.branch == "main"

env:
  # Configure these in Buildkite Pipeline Settings → Environment Variables
  # AZURE_CLIENT_ID: "your-client-id"
  # AZURE_CLIENT_SECRET: "your-client-secret"
  # AZURE_TENANT_ID: "your-tenant-id"
  # AZURE_SUBSCRIPTION_ID: "your-subscription-id"
