steps:
  - label: ":azure: Install Azure CLI and Login"
    command: |
      # Install Azure CLI based on OS
      if [ -x "$(command -v apt-get)" ]; then
        # Debian/Ubuntu
        echo "Installing Azure CLI on Debian/Ubuntu..."
        curl -sL https://aka.ms/InstallAzureCLIDeb | sudo bash
      elif [ -x "$(command -v yum)" ]; then
        # RHEL/CentOS
        echo "Installing Azure CLI on RHEL/CentOS..."
        sudo rpm --import https://packages.microsoft.com/keys/microsoft.asc
        sudo sh -c 'echo -e "[azure-cli]\nname=Azure CLI\nbaseurl=https://packages.microsoft.com/yumrepos/azure-cli\nenabled=1\ngpgcheck=1\ngpgkey=https://packages.microsoft.com/keys/microsoft.asc" > /etc/yum.repos.d/azure-cli.repo'
        sudo yum install -y azure-cli
      elif [ -x "$(command -v brew)" ]; then
        # macOS
        echo "Installing Azure CLI on macOS..."
        brew update && brew install azure-cli
      elif [ "$OS" == "Windows_NT" ]; then
        # Windows (PowerShell)
        echo "Installing Azure CLI on Windows..."
        powershell -Command "Invoke-WebRequest -Uri https://aka.ms/installazurecliwindows -OutFile .\AzureCLI.msi; Start-Process msiexec.exe -Wait -ArgumentList '/I AzureCLI.msi /quiet'; Remove-Item .\AzureCLI.msi"
      else
        echo "Unsupported OS. Please install Azure CLI manually."
        exit 1
      fi

      # Verify installation
      echo "--- :azure: Verifying Azure CLI installation"
      az version

      # Login with service principal using Buildkite Agent Secrets
      echo "--- :key: Authenticating with Azure"
      if [ ! -z "$AZURE_CLIENT_ID" ] && [ ! -z "$AZURE_CLIENT_SECRET" ] && [ ! -z "$AZURE_TENANT_ID" ]; then
        echo "Azure credentials detected from Agent Secrets"
        echo "Logging in with service principal..."
        
        az login --service-principal \
          --username "$AZURE_CLIENT_ID" \
          --password "$AZURE_CLIENT_SECRET" \
          --tenant "$AZURE_TENANT_ID"
        
        echo "--- :white_check_mark: Login successful!"
        
        # Display account information
        echo "Current Azure account:"
        az account show --output table
        
        # Create success annotation
        buildkite-agent annotate --style success --context azure-login << EOF
      ### :white_check_mark: Azure Authentication Successful
      
      **Tenant ID:** \`${AZURE_TENANT_ID}\`
      
      **Logged in account:**
      \`\`\`
      $(az account show --output json | jq -r '"\(.name) (\(.id))"')
      \`\`\`
      EOF
        
      else
        echo "--- :warning: Azure credentials not found"
        echo "Please configure the following in Buildkite Agent Secrets:"
        echo "  - AZURE_CLIENT_ID"
        echo "  - AZURE_CLIENT_SECRET"
        echo "  - AZURE_TENANT_ID"
        
        # Create warning annotation
        buildkite-agent annotate --style warning --context azure-login << EOF
      ### :warning: Azure Credentials Not Configured
      
      Please add the following secrets in Buildkite:
      1. Go to Pipeline Settings → Agent Secrets
      2. Add:
         - \`AZURE_CLIENT_ID\`
         - \`AZURE_CLIENT_SECRET\`
         - \`AZURE_TENANT_ID\`
      EOF
        exit 1
      fi
    agents:
      queue: "default"
    # env:
    #   # Add your Azure credentials here or in Buildkite environment variables
    #   # AZURE_CLIENT_ID: "your-client-id"
    #   # AZURE_CLIENT_SECRET: "your-client-secret"
    #   # AZURE_TENANT_ID: "your-tenant-id"
